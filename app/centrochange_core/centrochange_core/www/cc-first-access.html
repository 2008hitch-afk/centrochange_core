<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Centro Change — Primo accesso</title><style>body{font:16px system-ui,sans-serif;background:#f5f8fa;color:#182d38;margin:0;display:grid;place-items:center;min-height:100vh}main{background:white;padding:2rem;border-radius:14px;max-width:28rem;width:calc(100% - 5rem);box-shadow:0 8px 30px #0001}label{display:block;margin:1rem 0 .4rem}input,button{box-sizing:border-box;width:100%;padding:.75rem;font:inherit}button{margin-top:1rem;background:#1768a0;color:white;border:0;border-radius:6px;cursor:pointer}p[role=alert]{color:#a02020}</style></head>
<body><main><h1>Imposta la password</h1><p>Usa il link personale in una finestra riservata. Scegli una password sicura.</p><form id="setup"><label for="password">Nuova password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm">Conferma password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><button type="submit">Imposta password</button></form><p id="message" role="alert"></p></main>
<script>
(()=>{'use strict';const key=new URLSearchParams(location.hash.slice(1)).get('key');history.replaceState(null,'',location.pathname);const form=document.getElementById('setup'),message=document.getElementById('message');const guest={{ 'true' if is_guest else 'false' }};if(!guest||!key||(location.protocol!=='https:'&&!['localhost','127.0.0.1'].includes(location.hostname))){form.hidden=true;message.textContent=!guest?'Apri il link in una finestra riservata, senza altre sessioni attive.':'Link non valido o connessione non sicura.';return}form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password!==confirm){message.textContent='Le password non coincidono.';return}const button=form.querySelector('button');button.disabled=true;message.textContent='';try{const response=await fetch('/api/method/frappe.core.doctype.user.user.update_password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({key,new_password:password,logout_all_sessions:1})});if(!response.ok)throw Error();form.reset();location.replace('/premium')}catch{message.textContent='Impossibile impostare la password. Verifica la sicurezza della password o richiedi un nuovo link.';button.disabled=false}})})();
</script></body></html>
