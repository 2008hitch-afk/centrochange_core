<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>Centro Change — Finanza</title><link rel="stylesheet" href="/assets/centrochange_core/css/workspace.css">{% include "templates/cc_ui_assets.html" %}</head>
<body class="finance-page"><a class="visually-hidden-focusable cc-skip" href="#cc-main">Vai al contenuto</a><div class="app-shell page">{% include "templates/cc_ui_sidebar.html" %}
<div class="page-wrapper"><main class="page-body" id="cc-main">{% if uat_demo %}<p class="notice">Dati inventati · Invii simulati · <a href="/validazione">Guida alla validazione</a></p>{% endif %}<header class="page-header"><h1 id="page-title">Finanza</h1><button class="primary" id="finance-action">Nuova operazione</button></header><div class="notice" id="notice" role="status" hidden></div>
<div class="workspace"><section class="primary-region"><form class="filters" id="filters"><label>Centro<select id="center" required></select></label><label>Dal<input type="date" id="start" required></label><label>Al<input type="date" id="end" required></label><button class="primary" type="submit">Aggiorna</button></form><div id="finance-content" aria-live="polite"></div></section><aside class="detail" id="detail" aria-label="Dettaglio paziente"><p class="empty">Seleziona una seduta per aprire il dettaglio.</p></aside></div></main></div></div>
<dialog id="modal"><form id="modal-form"><div class="modal-header"><h2 id="modal-title"></h2><button type="button" id="modal-dismiss" aria-label="Chiudi">×</button></div><div id="modal-fields"></div><p id="modal-error" class="error" role="alert"></p><button class="primary" type="submit" id="modal-submit">Conferma</button></form></dialog>
<script type="module" src="/assets/centrochange_core/js/finance_workspace.js"></script></body></html>
