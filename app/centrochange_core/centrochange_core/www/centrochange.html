<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token }}"><title>Centro Change — Agenda</title><link rel="stylesheet" href="/assets/centrochange_core/css/workspace.css">{% include "templates/cc_ui_assets.html" %}</head>
<body class="agenda-page"><a class="visually-hidden-focusable cc-skip" href="#cc-main">Vai al contenuto</a><div class="app-shell page">{% include "templates/cc_ui_sidebar.html" %}
<div class="page-wrapper"><main class="page-body" id="cc-main">{% if uat_demo %}<p class="notice uat-banner">Dati inventati · Invii simulati · <a href="/validazione">Guida alla validazione</a></p>{% endif %}<header class="page-header"><h1 id="page-title">Agenda</h1><button class="primary" type="button" id="new-booking">+ Prenota</button></header><div class="notice" id="notice" role="status" hidden></div>
<div class="workspace"><section class="primary-region"><form class="filters" id="filters"><label class="center-filter">Centro<select id="center" required></select></label><label id="date-start-filter">Dal<input type="date" id="start" required></label><label id="date-end-filter">Al<input type="date" id="end" required></label><div class="agenda-controls" id="agenda-controls" hidden><div class="week-navigation" aria-label="Navigazione calendario"><button type="button" id="agenda-today">Oggi</button><button type="button" id="agenda-prev" aria-label="Settimana precedente">‹</button><label class="week-picker"><span id="week-label">Settimana</span><input type="date" id="week-date" aria-label="Scegli una data della settimana"></label><button type="button" id="agenda-next" aria-label="Settimana successiva">›</button></div><details class="practitioner-picker" id="practitioner-picker"><summary>Professionisti <span id="practitioner-count"></span></summary><div class="practitioner-options" id="practitioner-options"></div></details><label class="view-picker">Vista<select id="agenda-view"><option value="week">Settimana</option></select></label></div><button class="primary" type="submit" id="filters-submit">Aggiorna</button></form><div id="main-content" aria-live="polite"></div></section><aside class="detail" id="detail" aria-label="Dettaglio paziente"><p class="empty">Seleziona una seduta per aprire il dettaglio.</p></aside></div></main></div></div>
<dialog id="modal"><form id="modal-form"><div class="modal-header"><h2 id="modal-title"></h2><button type="button" id="modal-dismiss" aria-label="Chiudi">×</button></div><div id="modal-fields"></div><p id="modal-error" class="error" role="alert"></p><button class="primary" type="submit" id="modal-submit">Conferma</button></form></dialog>
<script type="module" src="/assets/centrochange_core/js/workspace.js"></script></body></html>
