# One clean DEV stack. Memory limits apply per service; swap is disabled.
services:
  configurator:
    mem_limit: 2g
    memswap_limit: 2g
  backend:
    mem_limit: 900m
    memswap_limit: 900m
  frontend:
    mem_limit: 160m
    memswap_limit: 160m
  websocket:
    mem_limit: 160m
    memswap_limit: 160m
  queue-short:
    mem_limit: 320m
    memswap_limit: 320m
  queue-long:
    mem_limit: 320m
    memswap_limit: 320m
  scheduler:
    mem_limit: 160m
    memswap_limit: 160m
  db:
    mem_limit: 1g
    memswap_limit: 1g
  redis-cache:
    mem_limit: 128m
    memswap_limit: 128m
  redis-queue:
    mem_limit: 128m
    memswap_limit: 128m
