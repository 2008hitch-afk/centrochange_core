name: Client presentation dataset isolated Frappe acceptance
on:
  push:
    branches:
      - feature/client-presentation-dataset-20261107

permissions:
  contents: read

jobs:
  dataset-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate dataset, Python syntax and exact source manifest
        run: |
          python3 infra/verify_presentation_dataset.py
          python3 -m unittest discover -s tests -p 'test_presentation_*.py'
          python3 -m unittest discover -s tests -p 'test_native_healthcare_scheduler.py'
          python3 -m py_compile infra/audit_presentation_backend_readonly.py
          python3 -m py_compile app/centrochange_core/centrochange_core/scheduling/native_scheduler.py
          python3 -m py_compile app/centrochange_core/centrochange_core/uat/presentation_seed.py app/centrochange_core/centrochange_core/uat/presentation_acceptance.py infra/presentation_clone.py infra/test_audit09_isolated_clone.py
          python3 infra/verify_full_single_stack.py --source

  frontend-synthetic:
    needs: dataset-offline
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend/premium
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: frontend/premium/package-lock.json
      - name: Install pinned package dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check types and compiled bundle
        run: |
          npm run typecheck
          npm run build
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run responsive synthetic browser regressions
        env:
          CI: '1'
        run: |
          npx playwright test --config=playwright.config.ts --workers=2
          npx playwright test --config=playwright.scoped.config.ts --workers=2
      - name: Verify exact committed frontend and source manifest
        working-directory: .
        run: |
          git diff --exit-code -- app/centrochange_core/centrochange_core/public/premium
          python3 infra/verify_full_single_stack.py --source

  presentation-clone:
    needs: [dataset-offline, frontend-synthetic]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate source
        run: python3 infra/verify_full_single_stack.py --source
      - name: Build pinned candidate image
        run: docker build -f infra/Dockerfile.single-stack-full --build-arg SINGLE_STACK_SOURCE_SHA=${{ github.sha }} -t cc205-ci:local .
      - name: Execute empty-site guarded 4/18/17/35 Frappe/MariaDB acceptance
        env:
          CC_CLONE_IMAGE: cc205-ci:local
        run: python3 infra/presentation_clone.py
      - name: Confirm isolated resources removed
        if: always()
        run: |
          test -z "$(docker ps -a --filter name=cc205-ci- --format '{{.Names}}')"
          test -z "$(docker volume ls --filter name=cc205-ci- --format '{{.Name}}')"
          test -z "$(docker network ls --filter name=cc205-ci- --format '{{.Name}}')"
