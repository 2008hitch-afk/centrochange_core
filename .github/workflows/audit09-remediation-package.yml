name: AUDIT-09 remediation pinned image package

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/audit09-remediation-package.yml]

permissions:
  contents: read

jobs:
  package:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'issue-183/remediation-package-332dc78'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 332dc7895a6e8e813a3fc61c4d00f892f097dde7
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned source
        run: |
          test "$(git rev-parse HEAD)" = 332dc7895a6e8e813a3fc61c4d00f892f097dde7
          test -z "$(git status --porcelain)"
          python3 infra/verify_full_single_stack.py --source
      - name: Build immutable candidate on ephemeral runner
        run: docker build --progress=plain -f infra/Dockerfile.single-stack-full --build-arg SINGLE_STACK_SOURCE_SHA=332dc7895a6e8e813a3fc61c4d00f892f097dde7 -t cc183-audit09:332dc78 .
      - name: Attest identity, assets and export
        run: |
          test "$(docker image inspect cc183-audit09:332dc78 --format '{{ index .Config.Labels "centrochange.source" }}')" = 332dc7895a6e8e813a3fc61c4d00f892f097dde7
          docker run --rm --entrypoint sh cc183-audit09:332dc78 -c 'test -s /home/frappe/frappe-bench/apps/centrochange_core/centrochange_core/public/premium/app.js && test -s /home/frappe/frappe-bench/apps/centrochange_core/centrochange_core/public/premium/app.css'
          docker image inspect cc183-audit09:332dc78 --format '{{.Id}} {{.Size}} {{ index .Config.Labels "centrochange.source" }}' > image-identity.txt
          docker save cc183-audit09:332dc78 | gzip -1 > cc183-audit09-332dc78.docker.tar.gz
          sha256sum cc183-audit09-332dc78.docker.tar.gz > package.sha256
          gzip -t cc183-audit09-332dc78.docker.tar.gz
          ls -lh cc183-audit09-332dc78.docker.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cc183-audit09-image-332dc78
          path: |
            cc183-audit09-332dc78.docker.tar.gz
            package.sha256
            image-identity.txt
          compression-level: 0
          retention-days: 2
