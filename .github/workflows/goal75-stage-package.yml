name: GOAL-75 pinned staging image package

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/goal75-stage-package.yml]

permissions:
  contents: read

jobs:
  package:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'issue-75/staging-package-8a3d6b9'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 8a3d6b96e82d0a0970beb0a828bac0adc83f103c
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned source
        run: |
          test "$(git rev-parse HEAD)" = 8a3d6b96e82d0a0970beb0a828bac0adc83f103c
          test -z "$(git status --porcelain)"
          python3 infra/verify_full_single_stack.py --source
      - name: Build immutable candidate on ephemeral runner
        run: docker build --progress=plain -f infra/Dockerfile.single-stack-full --build-arg SINGLE_STACK_SOURCE_SHA=8a3d6b96e82d0a0970beb0a828bac0adc83f103c -t cc75-ux:8a3d6b9 .
      - name: Attest identity, assets and export
        run: |
          test "$(docker image inspect cc75-ux:8a3d6b9 --format '{{ index .Config.Labels "centrochange.source" }}')" = 8a3d6b96e82d0a0970beb0a828bac0adc83f103c
          docker run --rm --entrypoint sh cc75-ux:8a3d6b9 -c 'test -s /home/frappe/frappe-bench/apps/centrochange_core/centrochange_core/public/premium/app.js && test -s /home/frappe/frappe-bench/apps/centrochange_core/centrochange_core/public/premium/app.css'
          docker image inspect cc75-ux:8a3d6b9 --format '{{.Id}} {{.Size}} {{ index .Config.Labels "centrochange.source" }}' > image-identity.txt
          docker save cc75-ux:8a3d6b9 | gzip -1 > cc75-ux-8a3d6b9.docker.tar.gz
          sha256sum cc75-ux-8a3d6b9.docker.tar.gz > package.sha256
          gzip -t cc75-ux-8a3d6b9.docker.tar.gz
          ls -lh cc75-ux-8a3d6b9.docker.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cc75-ux-image-8a3d6b9
          path: |
            cc75-ux-8a3d6b9.docker.tar.gz
            package.sha256
            image-identity.txt
          compression-level: 0
          retention-days: 2
