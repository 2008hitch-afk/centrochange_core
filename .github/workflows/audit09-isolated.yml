name: AUDIT-09 isolated Frappe and browser

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: audit09-isolated-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-frappe-browser:
    if: github.event.pull_request.number == 184 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: frontend/premium/package-lock.json
      - name: Install locked browser dependencies
        working-directory: frontend/premium
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright Chromium
        working-directory: frontend/premium
        run: npx playwright install --with-deps chromium
      - name: Build candidate browser assets on ephemeral runner
        working-directory: frontend/premium
        run: npm run typecheck && npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit09-built-assets-${{ github.event.pull_request.head.sha }}
          path: app/centrochange_core/centrochange_core/public/premium/
          retention-days: 7
      - name: Verify source manifest
        run: python3 infra/verify_full_single_stack.py --source
      - name: Build pinned single-stack Frappe image on ephemeral runner
        run: docker build --progress=plain -f infra/Dockerfile.single-stack-full --build-arg SINGLE_STACK_SOURCE_SHA=${{ github.event.pull_request.head.sha }} -t cc183-audit09-ci:local .
      - name: Run standalone synthetic Frappe/MariaDB and real Chromium
        env:
          CC_CLONE_IMAGE: cc183-audit09-ci:local
          NODE_PATH: ${{ github.workspace }}/frontend/premium/node_modules
          CC_ARTIFACT_DIR: ${{ github.workspace }}/.audit09-browser-artifacts
        run: python3 infra/test_audit09_isolated_clone.py
      - name: Assert testlab removed from runner
        if: always()
        run: |
          test -z "$(docker ps -a --format '{{.Names}}' | grep '^cc183-clone-' || true)"
          test -z "$(docker volume ls --format '{{.Name}}' | grep '^cc183-clone-' || true)"
          test -z "$(docker network ls --format '{{.Name}}' | grep '^cc183-clone-' || true)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: audit09-isolated-browser-${{ github.sha }}
          path: .audit09-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
