name: Presentation reconciliation manifest publisher
on:
  push:
    branches: [feature/client-presentation-dataset-20261107]
    paths: [.github/workflows/presentation-reconcile-manifest.yml]

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == '2008hitch-afk/centrochange_core'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate two-mode presentation source
        run: |
          python3 infra/verify_presentation_dataset.py
          python3 -m py_compile app/centrochange_core/centrochange_core/uat/presentation_seed.py app/centrochange_core/centrochange_core/uat/presentation_acceptance.py
          python3 infra/verify_full_single_stack.py --write-manifest
          python3 infra/verify_full_single_stack.py --source
          git add infra/full-single-stack-manifest.json
          git diff --cached --check
      - name: Publish updated backend manifest only to presentation branch
        run: |
          if ! git diff --cached --quiet; then
            git config user.name centrochange-ci
            git config user.email centrochange-ci@users.noreply.github.com
            git commit -m "build(uat): pin validated in-person/online presentation importer"
            git push origin HEAD:feature/client-presentation-dataset-20261107
          fi
