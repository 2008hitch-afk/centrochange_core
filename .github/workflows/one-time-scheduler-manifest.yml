name: One-time backend audit scheduler manifest update
on:
  push:
    branches: [feature/client-presentation-dataset-20261107]
    paths: [.github/workflows/one-time-scheduler-manifest.yml]

permissions:
  contents: write

jobs:
  manifest:
    if: github.repository == '2008hitch-afk/centrochange_core'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate safe scheduler and time normalization
        run: |
          python3 -m unittest discover -s tests -p 'test_presentation_*.py'
          python3 -m unittest discover -s tests -p 'test_native_healthcare_scheduler.py'
          python3 -m py_compile app/centrochange_core/centrochange_core/scheduling/native_scheduler.py infra/audit_presentation_backend_readonly.py
          python3 infra/verify_full_single_stack.py --write-manifest
          python3 infra/verify_full_single_stack.py --source
          git add infra/full-single-stack-manifest.json
          git diff --cached --check
      - name: Commit source manifest on draft branch only
        run: |
          if ! git diff --cached --quiet; then
            git config user.name centrochange-ci
            git config user.email centrochange-ci@users.noreply.github.com
            git commit -m "build: pin scheduler guard and audit time normalization"
            git push origin HEAD:feature/client-presentation-dataset-20261107
          fi
