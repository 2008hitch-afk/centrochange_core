name: Presentation dataset one-time manifest parity
on:
  push:
    branches:
      - feature/client-presentation-dataset-20261107
    paths:
      - .github/workflows/presentation-one-time-manifest.yml

permissions:
  contents: write

jobs:
  publish-manifest:
    if: github.repository == '2008hitch-afk/centrochange_core' && github.ref == 'refs/heads/feature/client-presentation-dataset-20261107'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check dataset and regenerate full single-stack source manifest
        run: |
          python3 infra/verify_presentation_dataset.py
          python3 infra/verify_full_single_stack.py --write-manifest
          python3 infra/verify_full_single_stack.py --source
          git add infra/full-single-stack-manifest.json
          git diff --cached --check
      - name: Commit generated manifest on presentation branch
        run: |
          if ! git diff --cached --quiet; then
            git config user.name centrochange-ci
            git config user.email centrochange-ci@users.noreply.github.com
            git commit -m "build(uat): synchronize reviewed presentation source manifest"
            git push origin HEAD:feature/client-presentation-dataset-20261107
          fi

# Rerun after allowlisting the reviewed presentation files.
