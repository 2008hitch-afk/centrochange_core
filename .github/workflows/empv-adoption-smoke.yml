name: EMPV brownfield isolated preview smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'factory/**'
      - 'scripts/dev_feedback.py'
      - 'frontend/premium/playwright.feedback.config.ts'
      - '.github/workflows/empv-adoption-smoke.yml'

permissions:
  contents: read

concurrency:
  group: empv-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-loopback-smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: frontend/premium/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend/premium
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for synthetic browser smoke
        working-directory: frontend/premium
        run: npx playwright install --with-deps chromium
      - name: Verify EMPV adapter is configured
        run: python3 scripts/dev_feedback.py --config factory/dev-feedback.example.json doctor
      - name: Verify simultaneous preview 5182 and synthetic browser server 5183
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/dev_feedback.py --config factory/dev-feedback.example.json preview > /tmp/empv-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill -TERM "$preview_pid" 2>/dev/null || true; wait "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if python3 scripts/dev_feedback.py --config factory/dev-feedback.example.json check; then break; fi
            sleep 1
          done
          python3 scripts/dev_feedback.py --config factory/dev-feedback.example.json check
          python3 scripts/dev_feedback.py --config factory/dev-feedback.example.json test --suite smoke --timeout 180
      - name: Confirm no changes to tracked application assets
        run: git diff --exit-code -- app/centrochange_core/centrochange_core/public/premium
