name: AUDIT-10 pinned staging image package

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/audit10-stage-package.yml]

permissions:
  contents: read

jobs:
  package:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'issue-190/package-0e32'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: c3e530bb1ef52fa6dd982e04b12b80b69aad77b3
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned source
        run: |
          test "$(git rev-parse HEAD)" = c3e530bb1ef52fa6dd982e04b12b80b69aad77b3
          test -z "$(git status --porcelain)"
          python3 infra/verify_full_single_stack.py --source
      - name: Build immutable candidate on ephemeral runner
        run: docker build --progress=plain -f infra/Dockerfile.single-stack-full --build-arg SINGLE_STACK_SOURCE_SHA=c3e530bb1ef52fa6dd982e04b12b80b69aad77b3 -t cc190-audit10:c3e530bb .
      - name: Attest identity, assets and export
        run: |
          test "$(docker image inspect cc190-audit10:c3e530bb --format '{{ index .Config.Labels "centrochange.source" }}')" = c3e530bb1ef52fa6dd982e04b12b80b69aad77b3
          docker run --rm --entrypoint sh cc190-audit10:c3e530bb -c 'test -s /home/frappe/frappe-bench/apps/centrochange_core/centrochange_core/public/premium/app.js && test -s /home/frappe/frappe-bench/apps/centrochange_core/centrochange_core/public/premium/app.css'
          docker image inspect cc190-audit10:c3e530bb --format '{{.Id}} {{.Size}} {{ index .Config.Labels "centrochange.source" }}' > image-identity.txt
          docker save cc190-audit10:c3e530bb | gzip -1 > cc190-audit10-c3e530bb.docker.tar.gz
          sha256sum cc190-audit10-c3e530bb.docker.tar.gz > package.sha256
          gzip -t cc190-audit10-c3e530bb.docker.tar.gz
          ls -lh cc190-audit10-c3e530bb.docker.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cc190-audit10-image-c3e530bb
          path: |
            cc190-audit10-c3e530bb.docker.tar.gz
            package.sha256
            image-identity.txt
          compression-level: 0
          retention-days: 2
