name: AUDIT-10 pinned staging image package

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/audit10-stage-package.yml]

permissions:
  contents: read

jobs:
  package:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'issue-190/package-0e32'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 0e32b075c8026e853d6dc5bf6a345737b902f5a6
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned source
        run: |
          test "$(git rev-parse HEAD)" = 0e32b075c8026e853d6dc5bf6a345737b902f5a6
          test -z "$(git status --porcelain)"
          python3 infra/verify_full_single_stack.py --source
      - name: Build immutable candidate on ephemeral runner
        run: docker build --progress=plain -f infra/Dockerfile.single-stack-full --build-arg SINGLE_STACK_SOURCE_SHA=0e32b075c8026e853d6dc5bf6a345737b902f5a6 -t cc190-audit10:0e32b075 .
      - name: Attest identity, assets and export
        run: |
          test "$(docker image inspect cc190-audit10:0e32b075 --format '{{ index .Config.Labels "centrochange.source" }}')" = 0e32b075c8026e853d6dc5bf6a345737b902f5a6
          docker run --rm --entrypoint sh cc190-audit10:0e32b075 -c 'test -s /home/frappe/frappe-bench/apps/centrochange_core/centrochange_core/public/premium/app.js && test -s /home/frappe/frappe-bench/apps/centrochange_core/centrochange_core/public/premium/app.css'
          docker image inspect cc190-audit10:0e32b075 --format '{{.Id}} {{.Size}} {{ index .Config.Labels "centrochange.source" }}' > image-identity.txt
          docker save cc190-audit10:0e32b075 | gzip -1 > cc190-audit10-0e32b075.docker.tar.gz
          sha256sum cc190-audit10-0e32b075.docker.tar.gz > package.sha256
          gzip -t cc190-audit10-0e32b075.docker.tar.gz
          ls -lh cc190-audit10-0e32b075.docker.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cc190-audit10-image-0e32b075
          path: |
            cc190-audit10-0e32b075.docker.tar.gz
            package.sha256
            image-identity.txt
          compression-level: 0
          retention-days: 2
