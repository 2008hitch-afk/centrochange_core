# Temporary AUDIT-11 source-controlled candidate packaging, branch-scoped.
# Remove this workflow before a final merge gate; no app deploy or DB access.
name: AUDIT-11 build candidate assets
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit11-candidate-assets.yml'
      - 'frontend/premium/src/first_meeting.tsx'
      - 'frontend/premium/src/style.css'
      - 'frontend/premium/tests/premium.spec.ts'
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: audit11-assets-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build-and-commit-on-branch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'audit-11/public-first-meeting-two-mode'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: frontend/premium/package-lock.json
      - name: Install immutable frontend dependencies and build
        working-directory: frontend/premium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Pin candidate assets and verify image recipe
        run: |
          set -euo pipefail
          git add -A app/centrochange_core/centrochange_core/public/premium/
          python3 infra/verify_full_single_stack.py --write-manifest
          git add infra/full-single-stack-manifest.json
          python3 infra/verify_full_single_stack.py --source
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in
              app/centrochange_core/centrochange_core/public/premium/*|infra/full-single-stack-manifest.json) ;;
              *) echo "Unexpected path: $file" >&2; exit 1 ;;
            esac
          done
      - name: Commit deterministic generated assets to isolated branch only
        if: github.event.pull_request.head.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$BRANCH" = "audit-11/public-first-meeting-two-mode"
          if git diff --cached --quiet; then echo 'No generated changes'; exit 0; fi
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED" || { echo 'Branch moved; safe STOP'; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(audit11): commit pinned public booking React assets"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/"$BRANCH"
